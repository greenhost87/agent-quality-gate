name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  verify-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run --silent verify

      - name: Test
        run: bun test

  install-e2e:
    runs-on: ubuntu-latest
    needs:
      - verify-and-test
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install E2E
        run: bun run test:e2e:install
        env:
          VERIFY_INSTALL_E2E: '1'

# Add projects here to enable automatic checks.
#
# presets: shipped names from presets/*/manifest.json
#   (baseline always on; optional: bun-parse, config, database, database-sqlite, playwright, layout)
# and home-installed names from $AGENT_QUALITY_GATE_HOME/presets/<name>/.
# Legacy aliases for layout: module-placement, test-colocation, packages.
#
# Install optional presets (for example from aqg-presets) with:
#   bun ./install.ts preset /absolute/path/to/preset-root
# or from aqg-presets: bun run install
#
# Gate policy stays in this file only — never in the target repo — so agents cannot
# disable presets or weaken rules through ordinary project edits.
#
# Unknown keys and invalid optional sections are ignored so the file can be edited
# incrementally without taking verify offline. Invalid YAML or project entries are
# skipped rather than failing the whole gate.
#
# Per-preset options live under presetConfig.<presetName>. Each preset owns its
# schema and how options map to oxlint rules (see that preset's gate-config.ts).
#
# verify: gate-wide verify tuning shared by every configured project.
#   lintGroups orders the oxlint output groups inside the verify pipeline; the first
#   non-empty group gates the run and later findings are deferred behind it. Entries
#   must be rule phases: boundaries, contracts, ui, lint. `boundaries` expands into
#   one group per plugin; `lint` (the catch-all for untagged rules) is appended last
#   when missing. boundaryPluginPriority orders plugins inside the boundaries phase.
#   Defaults: lintGroups [boundaries, contracts, lint, ui], priority [module-placement,
#   config, database, database-sqlite, playwright].
# verify:
#   lintGroups:
#     - boundaries
#     - contracts
#     - lint
#     - ui
#   boundaryPluginPriority:
#     - module-placement
#     - config
#     - database
#     - database-sqlite
#     - playwright
#
# presetConfig.baseline.literalDynamicImportFiles lists exact project-relative
# runtime-boundary files where relative string-literal import() calls are allowed.
# Computed and package-specifier imports remain forbidden.
#
# presetConfig.baseline.maxInlineParameterObjectMembers limits inline object types
# in parameters. -1 disables the check (default when omitted). 3 allows up to three.
#
# presetConfig.baseline.noClassSuffixes enables aqg/no-class (off until set). List
# allowed class-name / superclass suffixes such as [Error, Element]. An empty list
# bans every runtime class.
#
# presetConfig.baseline.noNullishExceptUndefined enables aqg/no-nullish-except-undefined
# (off by default). When true, only `T | undefined` absence is allowed; `null`,
# optional (`?:`), and non-return `void` forms are reported as errors. Standalone
# `void` function returns remain allowed.
#
# presetConfig.baseline.noMixedNullishTypes controls aqg/no-mixed-nullish-types
# (error by default). Set false to disable mixing checks for the project.
#
# presetConfig.layout (legacy keys: module-placement, test-colocation, packages)
# is the unified repository layout surface. See presets/layout/README.md.
# placement watches directories and requires production modules one concern level
# deeper. testColocation keeps tests out of production trees. packages enforces
# the declared package import graph (rule stays off until packages is configured).

# Example - this project with the database preset (transitively activates config):
# projects:
#   - root: /Users/greenhost/develop/ai/agent-quality-gate
#     entries:
#       - adapters/claude/*.ts
#       - adapters/cursor/*.ts
#       - adapters/mcp/*.ts
#       - adapters/pi/*.ts
#       - presets/baseline/oxlint/*.ts
#       - presets/baseline/oxlint/rules/*.ts
#       - scripts/*.ts
#     presets:
#       - database
#       - layout
#     presetConfig:
#       baseline:
#         maxInlineParameterObjectMembers: 3
#         noClassSuffixes: [Error, Element]
#       layout:
#         placement:
#           directories:
#             - system/agents
#           rootExceptions:
#             system/agents:
#               - agents.types.ts
#         testColocation:
#           policy: aqg-repository

projects: []
